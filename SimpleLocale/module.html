<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* Bewusst KEIN eigenes body-Padding/-Margin: Symcon reserviert dort
           standardmäßig Platz für Titel und Vergrößern-Symbol der Kachel, die als
           Overlay über dem Inhalt liegen. Das Standardpadding der Darstellung
           überschreiben nur bei echtem Bedarf, dann bewusst nur links/rechts (siehe
           offizielles Symcon-Beispielmodul "DuckCounters"), nie oben/unten. */

        .ipssl-select-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ipssl-select-row .ipssl-globe {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            font-size: 18px;
        }

        .ipssl-select-row select {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            font-size: 15px;
            font-family: inherit;
            color: inherit;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        .ipssl-select-row select:focus {
            outline: none;
            border-color: rgba(0, 0, 0, 0.35);
        }

        .ipssl-select-row .ipssl-info-icon {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 17px;
            color: rgba(0, 0, 0, 0.45);
            cursor: pointer;
            user-select: none;
        }

        .ipssl-select-row .ipssl-info-icon:hover {
            background: rgba(0, 0, 0, 0.06);
            color: rgba(0, 0, 0, 0.7);
        }

        /* position:fixed wirkt innerhalb eines iframes relativ zu dessen eigenem
           Viewport (nicht der Symcon-Seite dahinter) - anders als das native
           <select>-Popup (Browser-/WebView-eigenes Overlay, siehe das frühere
           Problem mit zu kleiner Kachel) ist das hier vollständig eigenes DOM/CSS
           und kann daher nicht auf dieselbe Art unerwartet abgeschnitten werden. */
        .ipssl-info-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .ipssl-info-modal {
            background: white;
            color: #222;
            border-radius: 10px;
            padding: 16px;
            max-width: 100%;
            max-height: 100%;
            overflow: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            line-height: 1.4;
        }

        .ipssl-info-modal ul {
            margin: 0;
            padding-left: 18px;
        }

        .ipssl-info-modal li + li {
            margin-top: 4px;
        }

        .ipssl-info-modal button {
            display: block;
            margin: 12px 0 0 auto;
            padding: 6px 14px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.08);
            cursor: pointer;
        }

        .ipssl-info-modal button:hover {
            background: rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <div id="<!--WRAPPER_ID-->"><!--LANGUAGE_SELECT--></div>

    <script>
        function handleMessage(data) {
            let message;
            try {
                message = JSON.parse(data);
            } catch (e) {
                return;
            }

            if (message.action === "REFRESH" && message.payload && typeof message.payload.html === "string") {
                document.getElementById("<!--WRAPPER_ID-->").innerHTML = message.payload.html;
            }
        }
    </script>
</body>
</html>
