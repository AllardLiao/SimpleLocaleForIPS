<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* Bewusst KEIN eigenes body-Padding/-Margin: Symcon reserviert dort
           standardmäßig Platz für Titel und Vergrößern-Symbol der Kachel, die als
           Overlay über dem Inhalt liegen. Das Standardpadding der Darstellung
           überschreiben nur bei echtem Bedarf, dann bewusst nur links/rechts (siehe
           offizielles Symcon-Beispielmodul "DuckCounters"), nie oben/unten. */

        .ipssl-select-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ipssl-select-row .ipssl-globe {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            font-size: 18px;
        }

        .ipssl-select-row select {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            font-size: 15px;
            font-family: inherit;
            color: inherit;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        .ipssl-select-row select:focus {
            outline: none;
            border-color: rgba(0, 0, 0, 0.35);
        }

        .ipssl-select-row .ipssl-info-icon {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 17px;
            color: rgba(0, 0, 0, 0.45);
            cursor: pointer;
            user-select: none;
        }

        .ipssl-select-row .ipssl-info-icon:hover {
            background: rgba(0, 0, 0, 0.06);
            color: rgba(0, 0, 0, 0.7);
        }

        /* Bewusst kein absolut positioniertes Popup/Tooltip: klappt stattdessen im
           normalen Textfluss unterhalb der Auswahlzeile auf - ein Overlay könnte
           je nach Einbettung (siehe Titel/Vergrößern-Symbol-Problem) abgeschnitten
           werden, das hier ist unabhängig von der Kachelgröße immer vollständig sichtbar. */
        .ipssl-info-popup {
            margin-top: 8px;
            padding: 8px 10px;
            font-size: 13px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 8px;
        }

        .ipssl-info-popup ul {
            margin: 0;
            padding-left: 18px;
        }

        .ipssl-info-popup li + li {
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="<!--WRAPPER_ID-->"><!--LANGUAGE_SELECT--></div>

    <script>
        function handleMessage(data) {
            let message;
            try {
                message = JSON.parse(data);
            } catch (e) {
                return;
            }

            if (message.action === "REFRESH" && message.payload && typeof message.payload.html === "string") {
                document.getElementById("<!--WRAPPER_ID-->").innerHTML = message.payload.html;
            }
        }
    </script>
</body>
</html>
