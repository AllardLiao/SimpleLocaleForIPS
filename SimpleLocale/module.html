<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* Bewusst KEIN eigenes body-Padding/-Margin: Symcon reserviert dort
           standardmäßig Platz für Titel und Vergrößern-Symbol der Kachel, die als
           Overlay über dem Inhalt liegen. Das Standardpadding der Darstellung
           überschreiben nur bei echtem Bedarf, dann bewusst nur links/rechts (siehe
           offizielles Symcon-Beispielmodul "DuckCounters"), nie oben/unten. */

        /* --ipssl-control-height: EINZIGE Quelle fuer die Hoehe von Dropdown UND
           Icon - bewusst NICHT ueber align-self:stretch/height:100% relativ zur
           Zeile geloest (erster Versuch, siehe Git-Historie): in der echten Kachel
           bekommt .ipssl-select-row selbst mehr Hoehe zugewiesen, als das Dropdown
           tatsaechlich braucht (vermutlich durch die umgebende WebFront-Kachel-
           Darstellung) - das Icon wurde dadurch sichtbar groesser als das
           Dropdown, obwohl es exakt auf die (zu grosse) Zeilenhoehe gestreckt war.
           Ein fester, gemeinsamer Wert fuer beide Elemente ist immun dagegen. */
        .ipssl-select-row {
            --ipssl-control-height: 38px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Build 143 (Nutzer-Wunsch): bei Visualisierungs-Hoehe "1" war die Kachel
           nur wenige Pixel zu hoch und zeigte dadurch einen Scrollbalken rechts.
           Diese Klasse setzt module.php genau dann zusaetzlich, wenn KEINE der
           drei optionalen Hinweiszeilen (Testphase/Pause/Statistik) angezeigt
           wird - dann ist der Platz unter dem Dropdown schlicht ungenutzt und
           wird per negativem Rand zurueckgeholt. Mit sichtbaren Hinweisen
           braucht die Kachel die Hoehe ohnehin, dort greift die Klasse nicht.

           Bewusst NUR unten: oben reserviert Symcon den Platz fuer Titel und
           Vergroessern-Symbol der Kachel (siehe Kommentar ganz oben) - ein
           negativer Rand dort wuerde das Dropdown unter die Titelzeile
           schieben. Reicht der zurueckgewonnene Platz nicht, ist -8px hier der
           Stellwert (nicht die Hoehe der Bedienelemente, die soll gleich
           bleiben). */
        .ipssl-select-row.ipssl-compact {
            margin-bottom: -8px;
        }

        .ipssl-select-row .ipssl-globe {
            flex: none;
            height: var(--ipssl-control-height);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .ipssl-select-row .ipssl-globe img {
            height: 100%;
            width: auto;
            display: block;
        }

        .ipssl-select-row select {
            flex: 1;
            min-width: 0;
            height: var(--ipssl-control-height);
            box-sizing: border-box;
            padding: 0 10px;
            font-size: 15px;
            font-family: inherit;
            color: inherit;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        .ipssl-select-row select:focus {
            outline: none;
            border-color: rgba(0, 0, 0, 0.35);
        }

        .ipssl-select-row .ipssl-info-icon {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 17px;
            color: rgba(0, 0, 0, 0.45);
            cursor: pointer;
            user-select: none;
        }

        .ipssl-select-row .ipssl-info-icon:hover {
            background: rgba(0, 0, 0, 0.06);
            color: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div id="<!--WRAPPER_ID-->"><!--LANGUAGE_SELECT--></div>

    <script>
        function handleMessage(data) {
            let message;
            try {
                message = JSON.parse(data);
            } catch (e) {
                return;
            }

            if (message.action === "REFRESH" && message.payload && typeof message.payload.html === "string") {
                document.getElementById("<!--WRAPPER_ID-->").innerHTML = message.payload.html;
            } else if (message.action === "ALERT" && message.payload && typeof message.payload.text === "string") {
                alert(message.payload.text);
            }
        }
    </script>
</body>
</html>
