<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
        }

        #ipssl-select-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #ipssl-select-wrapper .ipssl-globe {
            font-size: 20px;
            line-height: 1;
        }

        #ipssl-select-wrapper select {
            flex: 1;
            padding: 8px;
            font-size: 16px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div id="ipssl-select-wrapper"><!--LANGUAGE_SELECT--></div>

    <script>
        function handleMessage(data) {
            let message;
            try {
                message = JSON.parse(data);
            } catch (e) {
                return;
            }

            if (message.action === "REFRESH" && message.payload && typeof message.payload.html === "string") {
                document.getElementById("ipssl-select-wrapper").innerHTML = message.payload.html;
            }
        }
    </script>
</body>
</html>
