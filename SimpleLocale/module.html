<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 8px 4px;
            box-sizing: border-box;
        }

        .ipssl-select-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ipssl-select-wrapper .ipssl-globe {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            font-size: 18px;
        }

        .ipssl-select-wrapper select {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            font-size: 15px;
            font-family: inherit;
            color: inherit;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        .ipssl-select-wrapper select:focus {
            outline: none;
            border-color: rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body>
    <div id="<!--WRAPPER_ID-->" class="ipssl-select-wrapper"><!--LANGUAGE_SELECT--></div>

    <script>
        function handleMessage(data) {
            let message;
            try {
                message = JSON.parse(data);
            } catch (e) {
                return;
            }

            if (message.action === "REFRESH" && message.payload && typeof message.payload.html === "string") {
                document.getElementById("<!--WRAPPER_ID-->").innerHTML = message.payload.html;
            }
        }
    </script>
</body>
</html>
